services:
  harness:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: rineya/context-harness:0.1.0
    restart: unless-stopped
    init: true
    read_only: true
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - rineya_runtime:/app/artifacts/runtime
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; json.load(urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  rineya_runtime:
