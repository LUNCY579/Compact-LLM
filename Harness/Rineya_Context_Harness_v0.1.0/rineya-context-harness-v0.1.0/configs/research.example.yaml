database:
  path: ../artifacts/runtime/research.sqlite3
  wal: true
  synchronous: FULL

model:
  provider: openai_compatible
  model: rineya-1-454m
  base_url: http://127.0.0.1:8080/v1
  temperature: 0.0
  max_output_tokens: 256
  enable_thinking: false

search:
  provider: searxng
  base_url: http://127.0.0.1:8888
  max_results: 8
  max_response_bytes: 1000000
  fetch_concurrency: 4
  passage_chars: 700
  passage_overlap_chars: 100
  max_passages_per_round: 4
  max_passages_per_source: 2

web:
  enabled: true
  allow_private_networks: false
  allow_nonstandard_ports: false
  allowed_ports: [80, 443]

workflow_budget:
  max_rounds: 3
  max_model_calls: 8
  max_search_calls: 3
  max_sources_fetched: 8
  max_wall_seconds: 90

context_budget:
  total_tokens: 2048
  static_tokens: 240
  goal_tokens: 256
  state_tokens: 512
  evidence_tokens: 704
  recent_tokens: 208
  reserve_output_tokens: 128
