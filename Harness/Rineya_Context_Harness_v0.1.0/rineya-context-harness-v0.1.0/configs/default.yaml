database:
  path: artifacts/runtime/rineya_harness.sqlite3
  wal: true
  busy_timeout_ms: 5000
  synchronous: FULL

memory:
  archive_before_purge: true
  allow_purge: false
  purge_confirmation_token: null
  max_active_items: 64
  default_temperature: warm

model:
  provider: deterministic
  model: rineya-local
  base_url: http://127.0.0.1:8080/v1
  api_key: null
  timeout_seconds: 60
  max_output_tokens: 160
  temperature: 0.0
  enable_thinking: false

search:
  provider: fixture
  base_url: http://127.0.0.1:8888
  timeout_seconds: 15
  max_results: 8
  max_response_bytes: 1000000
  fetch_concurrency: 4
  passage_chars: 700
  passage_overlap_chars: 100
  max_passages_per_round: 4
  max_passages_per_source: 2

web:
  enabled: false
  timeout_seconds: 15
  max_response_bytes: 2000000
  max_redirects: 3
  allow_private_networks: false
  allow_nonstandard_ports: false
  allowed_ports: [80, 443]
  user_agent: RineyaContextHarness/0.1 (+local-research-runtime)

trace:
  directory: artifacts/runtime/traces
  include_tool_payloads: true
  max_payload_chars: 20000

api:
  host: 127.0.0.1
  port: 8765
  reload: false

workflow_budget:
  max_rounds: 3
  max_model_calls: 8
  max_search_calls: 3
  max_sources_fetched: 8
  max_wall_seconds: 90
  max_active_memory_items: 64

context_budget:
  total_tokens: 2048
  static_tokens: 240
  goal_tokens: 256
  state_tokens: 512
  evidence_tokens: 704
  recent_tokens: 208
  reserve_output_tokens: 128
