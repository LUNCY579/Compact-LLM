# Example for a local OpenAI-compatible Rineya endpoint such as llama.cpp server or vLLM.
model:
  provider: openai_compatible
  model: rineya-1-454m
  base_url: http://127.0.0.1:8080/v1
  api_key: null
  timeout_seconds: 90
  max_output_tokens: 160
  temperature: 0.0
  enable_thinking: false

search:
  provider: searxng
  base_url: http://127.0.0.1:8888
  max_results: 8
  max_response_bytes: 1000000
  fetch_concurrency: 4
  passage_chars: 700
  passage_overlap_chars: 100
  max_passages_per_round: 4
  max_passages_per_source: 2

web:
  enabled: true
  allow_private_networks: false

memory:
  allow_purge: false

context_budget:
  total_tokens: 2048
  reserve_output_tokens: 128
