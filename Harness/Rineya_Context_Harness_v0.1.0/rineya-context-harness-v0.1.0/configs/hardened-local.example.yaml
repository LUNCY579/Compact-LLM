database:
  path: ../artifacts/runtime/hardened.sqlite3
  wal: true
  busy_timeout_ms: 5000
  synchronous: FULL

memory:
  archive_before_purge: true
  allow_purge: false
  max_active_items: 48

model:
  provider: openai_compatible
  model: rineya-1-454m
  base_url: http://127.0.0.1:8080/v1
  timeout_seconds: 60
  max_output_tokens: 192
  temperature: 0.0
  enable_thinking: false

search:
  provider: fixture
  max_results: 6

web:
  enabled: false

trace:
  directory: ../artifacts/runtime/traces
  include_tool_payloads: false
  max_payload_chars: 5000

api:
  host: 127.0.0.1
  port: 8765
  reload: false
