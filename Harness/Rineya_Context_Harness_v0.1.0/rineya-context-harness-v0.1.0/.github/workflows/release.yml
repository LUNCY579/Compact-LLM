name: Release artifact

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[api,dev]"
      - run: python scripts/package_release.py --output Rineya_Context_Harness_v0.1.0.zip
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            Rineya_Context_Harness_v0.1.0.zip
            Rineya_Context_Harness_v0.1.0.zip.sha256
