[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rineya-context-harness"
version = "0.1.0"
description = "Small-model-first context, evidence, and recursive-state-forgetting harness for Rineya."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "Rineya Project Contributors" }]
keywords = [
  "small-language-model",
  "agent-harness",
  "recursive-state-forgetting",
  "context-management",
  "retrieval-augmented-generation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
  "typer>=0.15,<1",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "types-PyYAML>=6.0,<7",
  "pre-commit>=4,<5",
]
local-transformers = [
  "transformers>=4.48,<6",
  "torch>=2.5,<3",
]

[project.scripts]
rineya-harness = "rineya_harness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rineya_harness"]

[tool.hatch.build]
include = [
  "src/rineya_harness/**/*.py",
  "src/rineya_harness/py.typed",
  "src/rineya_harness/migrations/*.sql",
  "README.md",
  "LICENSE",
  "NOTICE",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "integration: tests that use a network service or subprocess",
  "slow: tests that are intentionally slower than the CPU-safe default suite",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = ["schemas/generated"]

[tool.ruff.lint]
select = [
  "E", "F", "I", "UP", "B", "SIM", "ASYNC", "C4", "DTZ", "G", "N", "PIE", "PTH", "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
exclude = ["schemas/generated"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.coverage.run]
branch = true
source = ["rineya_harness"]
omit = [
  "src/rineya_harness/__main__.py",
  "src/rineya_harness/_version.py",
  "src/rineya_harness/api/app.py",
  "src/rineya_harness/cli.py",
  "src/rineya_harness/examples.py",
  "src/rineya_harness/models/ollama.py",
  "src/rineya_harness/models/openai_compatible.py",
  "src/rineya_harness/search/searxng.py",
  "src/rineya_harness/web/fetcher.py",
]
