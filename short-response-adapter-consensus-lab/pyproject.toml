[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "short-response-adapter-consensus-lab"
version = "0.1.0"
description = "Isolated multi-adapter token-consensus experiments for the official short-response model"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.14,<2",
  "matplotlib>=3.11,<4",
  "numpy>=2.0,<3",
  "pandas>=3.0,<4",
  "peft>=0.19,<0.20",
  "psutil>=7,<8",
  "pyyaml>=6,<7",
  "safetensors>=0.8,<0.9",
  "scikit-learn>=1.7,<2",
  "scipy>=1.17,<2",
  "torch>=2.12,<2.13",
  "transformers>=5.14,<5.15",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-cov>=7,<8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires local model artifacts and may use CUDA",
  "slow: computationally expensive test",
]

