phase:
  id: "2B"
  name: progressive_structural_reduction
  purpose: >-
    Test every current decoder layer as a reversible physical deletion, recover
    the strongest candidates with short SFT, and preserve a progressive frontier
    while proportional loaded weight-memory savings exceed proportional combined
    quality opportunity loss.

probe:
  source: data/dev/dev.jsonl
  output: data/phase_2_structural_reduction/probe_50.jsonl
  cases: 50
  sealed_data_used: false

search:
  max_progressive_drops: 6
  recovery_top_k_per_stage: 3
  recovery_steps: 50

relative_opportunity_policy:
  quality_evaluation_version: "4.5"
  policy_file: configs/relative_opportunity_evaluation.json
  quality_profile: balanced
  primary_resource: loaded_weight_tensor_memory_reduction
  decision_rule: resource_gain_strictly_greater_than_quality_opportunity_loss
  absolute_quality_floors: prohibited
  issue_counts: proportional_quality_costs_not_vetoes
  technical_invalidity_remains_binary: true

retention:
  preserve_full_reference: true
  preserve_each_accepted_frontier_checkpoint: true
  preserve_all_outputs_and_metrics: true
  preserve_rejected_full_checkpoints: false

profiles: [full_quality, balanced, min_memory]
