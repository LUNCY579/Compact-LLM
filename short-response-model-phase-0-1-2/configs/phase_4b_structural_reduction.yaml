phase:
  id: "4B"
  name: structural_reduction_and_reference_selection
  purpose: >-
    Build physically smaller candidates from the accepted Phase 4 checkpoint,
    evaluate them with Quality Evaluator v3, and recommend a Pareto-efficient
    downstream model using proportional opportunity cost.
inputs:
  accepted_phase_4_model: artifacts/phase_4_soup/merged_model
  calibration: data/phase_4b_structural_reduction/long_form_calibration.jsonl
  benchmark: data/benchmark/shortchatbench_pilot.jsonl
pilot_matrix:
  mlp_prune_ratios: [0.10]
  depth_drop_counts: [2]
  include_random_mlp_control: true
  include_uniform_depth_control: true
  enable_attention_pruning: false
full_matrix:
  mlp_prune_ratios: [0.05, 0.10, 0.20]
  depth_drop_counts: [1, 2, 4]
  attention_group_prune_ratios: [0.10]
pruning:
  mlp_multiple: 64
  short_importance_quantile: 0.60
  default_selection_method: long-specific
relative_opportunity_policy:
  quality_evaluation_version: "4.5"
  policy_file: configs/relative_opportunity_evaluation.json
  quality_profile: balanced
  primary_resource: structural_weight_memory_reduction
  decision_rule: resource_gain_strictly_greater_than_quality_opportunity_loss
  absolute_quality_floors: prohibited
outputs:
  artifact_root: artifacts/phase_4b_structural_reduction
  selected_reference_manifest: artifacts/references/selected_inference_reference.json
  stop_gate_report: reports/PHASE_4B_STOP_GATE.md
