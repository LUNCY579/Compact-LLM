phase: 2C
name: importance_guided_targeted_recovery
source:
  phase2b_profile: balanced
  catalog: artifacts/phase_2_progressive_reduction/model_catalog.json
  gate: reports/PHASE_2B_STOP_GATE.md
  registry: artifacts/phase_2_progressive_reduction/candidate_registry.json
data:
  train: data/phase_2c_targeted_recovery/train.jsonl
  dev: data/phase_2c_targeted_recovery/dev.jsonl
  sealed_used: false
ranking:
  calibration_limit: 64
  gradient_taylor_weight: 0.35
  temporary_ablation_nll_weight: 0.45
  phase2b_structural_weight: 0.20
training:
  method: qlora
  max_steps: 200
  lora_rank: 16
  base_seed: 11
  repeat_seeds: [23, 37]
  repeat_top_k: 2
  gradient_checkpointing: true
candidates:
  - all_remaining
  - top1
  - top2
  - top4
  - top8
  - complementary4
  - random4
  - low4
  - top4_attention
  - top4_mlp
relative_opportunity_policy:
  quality_evaluation_version: "3.0"
  policy_file: configs/relative_opportunity_evaluation.json
  quality_profile: balanced
  primary_resource: trainable_parameter_and_training_memory_reduction
  decision_rule: resource_gain_strictly_greater_than_quality_opportunity_loss
  absolute_quality_floors: prohibited
  repeat_seed_decision: compare_mean_proportional_benefit_with_mean_proportional_loss
  same_seed_all_remaining_controls: technical_comparability_only
