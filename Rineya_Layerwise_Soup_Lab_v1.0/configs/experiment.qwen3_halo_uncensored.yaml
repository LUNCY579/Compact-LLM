schema_version: "1.0"

project:
  name: qwen3_halo_uncensored_layerwise
  seed: 20260820
  run_root: ../runs
  run_name: qwen3_halo_uncensored
  research_mode: true

models:
  # Same 28L scaffold. Uncensored kept blocks are the Halo donor; dropped / embed /
  # norm / lm_head stay official Qwen3, so they are identical on both endpoints.
  # Uniform α=0.5 is Halo. α=1 is Halo Uncensored. Do not write into the vault.
  anchor_path: C:/Users/clclc/BusinessProject/Chat-Bubble/Qwen3-0.6B
  greedy_path: C:/Users/clclc/BusinessProject/Chat-Bubble/Rineya_Published_Cores/Rineya-Halo-Uncensored-1.5.0-devfreeze
  tokenizer_path: C:/Users/clclc/BusinessProject/Chat-Bubble/Qwen3-0.6B
  base_model_path: null
  trust_remote_code: true
  expected_layers: 28
  layer_key_regex: '(?:^|\.)layers\.(\d+)\.'
  merge_accumulation_dtype: float32
  output_dtype: preserve_anchor
  max_shard_size_gb: 1.5
  copy_non_floating_from: anchor
  require_non_floating_equal: true
  allow_quantized_sources: false
  lineage_acknowledged: true
  # Vault Uncensored was rewritten by a newer transformers (rope_parameters,
  # layer_types, omitted tied lm_head.weight). Generation uses tokenizer_path.
  allow_hf_serialization_drift: true

datasets:
  dev: C:/Users/clclc/BusinessProject/Chat-Bubble/short-response-model-phase-0-1-2/data/dev/dev.jsonl
  test: C:/Users/clclc/BusinessProject/Chat-Bubble/short-response-model-phase-0-1-2/data/sealed/sealed.jsonl
  allow_id_overlap: false
  allow_prompt_overlap: false

evaluation:
  backend: bundled_v45
  official_repo_root: C:/Users/clclc/BusinessProject/Chat-Bubble/short-response-model-phase-0-1-2
  python_executable: null
  quality_config: official_v45/quality_evaluation.json
  selection_protocol: official_no_think
  run_secondary_protocols_on_finalists: false

  protocols:
    official_no_think:
      enable_thinking: false
      extract_final_after_thinking: false
      response_control: eos_only
      max_new_tokens: 32
      min_new_tokens_before_boundary: 1
      do_sample: false
      temperature: 0.6
      top_p: 0.9
      capture_token_probabilities: false
      require_cuda: false
      wait_for_gpu: true
      gpu_wait_poll_seconds: 60
      device_map: auto
      max_memory_gpu_gib: 6
      max_memory_cpu_gib: 30
      system_prompt: >-
        Reply like a casual text message. Use only a few words or one short sentence.
        Be accurate, use the conversation context, ask one brief clarification when
        information is missing, and keep safety boundaries concise.

    think_then_short:
      enabled: false
      enable_thinking: true
      extract_final_after_thinking: true
      response_control: eos_only
      max_new_tokens: 256
      min_new_tokens_before_boundary: 1
      do_sample: false
      temperature: 0.6
      top_p: 0.9
      capture_token_probabilities: true
      require_cuda: false
      system_prompt: >-
        Think internally if useful, then give only the shortest complete final answer
        that is accurate, natural, context-consistent, and safe.

  external_command: null
  external_summary_path: "{output_dir}/summary.json"
  external_results_path: "{output_dir}/results.jsonl"
  mock_allowed: false

objective:
  metrics:
    - {path: mean_quality_score, weight: 0.30, transform: maximize_01}
    - {path: worst_decile_mean_quality_score, weight: 0.20, transform: maximize_01}
    - {path: complete_utterance_rate, weight: 0.10, transform: maximize_01}
    - {path: observable_quality_pass_rate, weight: 0.10, transform: maximize_01}
    - {path: mean_quality_dimensions.task_adequacy, weight: 0.10, transform: maximize_01}
    - {path: mean_quality_dimensions.factual_correctness, weight: 0.08, transform: maximize_01}
    - {path: mean_quality_dimensions.context_consistency, weight: 0.05, transform: maximize_01}
    - path: median_reply_tokens
      weight: 0.04
      transform: target_range
      minimum: 1
      maximum: 12
      soft_upper: 24
    - {path: duplicate_reply_rate, weight: 0.03, transform: minimize_01}

  case_utility:
    quality_weight: 0.72
    completeness_weight: 0.10
    observable_pass_weight: 0.08
    brevity_weight: 0.10
    brevity_target_min: 1
    brevity_target_max: 12
    brevity_soft_upper: 24

statistics:
  bootstrap_samples: 2000
  confidence_level: 0.95
  seed: 20260820
  minimum_accept_probability: 0.60
  minimum_objective_delta: 0.0001

experiments:
  run_endpoints: true

  uniform:
    enabled: true
    alpha: 0.50

  global_sweep:
    enabled: true
    alphas: [0.00, 0.25, 0.50, 0.75, 1.00]
    refine_around_best: true
    refine_step: 0.05
    refine_radius: 0.10

  probability_profile:
    enabled: false
    max_cases: 150
    top_k: 128
    include_reference_trajectory: true

  layer_influence:
    enabled: true
    # Phase 2B kept Qwen3 ids only. Dropped layers are identical on both endpoints.
    layers: [0, 1, 2, 3, 4, 5, 11, 12, 13, 15, 16, 17, 19, 20, 21, 22, 25, 26, 27]
    bidirectional_swaps: true
    centered_alpha_grid: [0.00, 0.50, 1.00]
    smoothing_penalty: 0.05
    global_shrinkage_penalty: 0.10
    minimum_reliability: 0.0

  layer_search:
    enabled: true
    coordinate_descent: true
    max_passes: 1
    alpha_grid: [0.00, 0.25, 0.50, 0.75, 1.00]
    top_layers_only: 8
    max_candidate_evaluations: 40
    pairwise_top_k: 0

  finalists:
    include: [anchor, greedy, uniform, global_best, layerwise_seed, layerwise_best]
    maximum: 6
    selection_strategy: robust_sequential
    sequence: [best_endpoint, uniform, global_best, layerwise_seed, layerwise_best]

storage:
  retain_candidate_weights: [uniform, global_best, layerwise_seed, layerwise_best]
  delete_ephemeral_after_evaluation: true
  candidate_cache_dir: candidate_cache
  max_disk_gb: 40

sealed_test:
  enabled: false
  allow_repeat: false
  require_selection_freeze: true

reporting:
  make_plots: true
  write_markdown: true
  top_case_examples: 20
