[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rineya-layerwise-soup-lab"
version = "1.0.0"
description = "Standalone, resumable anchor-vs-greedy model-soup and layer-wise interpolation research pipeline for Rineya."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Rineya Research Project"}]
dependencies = [
  "torch>=2.7",
  "transformers>=4.57",
  "accelerate>=1.10",
  "safetensors>=0.5",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "rapidfuzz>=3.9",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
adapters = ["peft>=0.15"]
dev = ["pytest>=8.3", "ruff>=0.9", "mypy>=1.14", "jsonschema>=4.23"]

[project.scripts]
rineya-soup = "rineya_soup_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rineya_soup_lab = ["resources/*.yaml", "resources/official_v45/*.json", "vendor/official_v45/*.json", "vendor/official_v45/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
