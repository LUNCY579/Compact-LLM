schema_version: "1.0"

project:
  name: rineya_anchor_greedy_layerwise_soup
  seed: 20260815
  run_root: ../runs
  run_name: null                 # null creates a timestamped run
  research_mode: true

models:
  # Use full, dequantized Hugging Face checkpoints. Do not point directly to
  # GPTQ/AWQ/GGUF/int4 deployment artifacts.
  anchor_path: C:/PATH/TO/RINEYA_ANCHOR
  greedy_path: C:/PATH/TO/RINEYA_GREEDY_SOUP
  tokenizer_path: C:/PATH/TO/RINEYA_ANCHOR
  base_model_path: null          # needed only when a source is a PEFT adapter
  trust_remote_code: false
  expected_layers: 12
  layer_key_regex: '(?:^|\.)layers\.(\d+)\.'
  merge_accumulation_dtype: float32
  output_dtype: preserve_anchor  # preserve_anchor | float32 | float16 | bfloat16
  max_shard_size_gb: 1.5
  copy_non_floating_from: anchor
  require_non_floating_equal: true
  allow_quantized_sources: false
  # Set true only after you confirm both checkpoints descend from the same
  # architecture/tokenizer/base lineage. The preflight report records this.
  lineage_acknowledged: true

datasets:
  # Development data is used to choose every coefficient.
  dev: C:/PATH/TO/OFFICIAL_PHASE_4_5_DEV.jsonl
  # Test is accessed only after selection_freeze.json is written.
  test: C:/PATH/TO/OFFICIAL_PHASE_4_5_SEALED_TEST.jsonl
  allow_id_overlap: false
  allow_prompt_overlap: false

evaluation:
  # bundled_v45: bundled v4.5 scorer + standalone generator.
  # official_phase_v45: launches the original official phase evaluator.
  # external: launches a custom command template.
  backend: bundled_v45
  official_repo_root: C:/PATH/TO/OFFICIAL_SHORT_RESPONSE_REPOSITORY
  python_executable: null
  quality_config: official_v45/quality_evaluation.json
  selection_protocol: official_no_think
  # Enabled non-selection protocols are run on DEV finalists after selection freezes.
  # They are descriptive robustness checks and cannot change the selected recipe.
  run_secondary_protocols_on_finalists: true

  protocols:
    official_no_think:
      enable_thinking: false
      extract_final_after_thinking: false
      response_control: eos_only
      max_new_tokens: 32
      min_new_tokens_before_boundary: 1
      do_sample: false
      temperature: 0.6
      top_p: 0.9
      capture_token_probabilities: false
      require_cuda: true
      system_prompt: >-
        Reply like a casual text message. Use only a few words or one short sentence.
        Be accurate, use the conversation context, ask one brief clarification when
        information is missing, and keep safety boundaries concise.

    # Optional independent protocol. It does not silently replace official_no_think.
    think_then_short:
      enabled: false
      enable_thinking: true
      extract_final_after_thinking: true
      response_control: eos_only
      max_new_tokens: 256
      min_new_tokens_before_boundary: 1
      do_sample: false
      temperature: 0.6
      top_p: 0.9
      capture_token_probabilities: true
      require_cuda: true
      system_prompt: >-
        Think internally if useful, then give only the shortest complete final answer
        that is accurate, natural, context-consistent, and safe.

  # Used only with backend: external. Placeholders:
  # {python}, {model}, {dataset}, {output_dir}, {quality_config}, {protocol}
  external_command: null
  external_summary_path: "{output_dir}/summary.json"
  external_results_path: "{output_dir}/results.jsonl"
  mock_allowed: false

objective:
  # All coefficient decisions are based on the development split only.
  metrics:
    - {path: mean_quality_score, weight: 0.30, transform: maximize_01}
    - {path: worst_decile_mean_quality_score, weight: 0.20, transform: maximize_01}
    - {path: complete_utterance_rate, weight: 0.10, transform: maximize_01}
    - {path: observable_quality_pass_rate, weight: 0.10, transform: maximize_01}
    - {path: mean_quality_dimensions.task_adequacy, weight: 0.10, transform: maximize_01}
    - {path: mean_quality_dimensions.factual_correctness, weight: 0.08, transform: maximize_01}
    - {path: mean_quality_dimensions.context_consistency, weight: 0.05, transform: maximize_01}
    - path: median_reply_tokens
      weight: 0.04
      transform: target_range
      minimum: 1
      maximum: 12
      soft_upper: 24
    - {path: duplicate_reply_rate, weight: 0.03, transform: minimize_01}

  case_utility:
    quality_weight: 0.72
    completeness_weight: 0.10
    observable_pass_weight: 0.08
    brevity_weight: 0.10
    brevity_target_min: 1
    brevity_target_max: 12
    brevity_soft_upper: 24

statistics:
  bootstrap_samples: 2000
  confidence_level: 0.95
  seed: 20260815
  minimum_accept_probability: 0.60
  minimum_objective_delta: 0.0001

experiments:
  run_endpoints: true

  uniform:
    enabled: true
    alpha: 0.50

  global_sweep:
    enabled: true
    alphas: [0.00, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90, 1.00]
    refine_around_best: true
    refine_step: 0.025
    refine_radius: 0.10

  probability_profile:
    enabled: false
    max_cases: 150
    top_k: 128
    include_reference_trajectory: true

  layer_influence:
    enabled: true
    layers: all
    bidirectional_swaps: true
    centered_alpha_grid: [0.00, 0.25, 0.50, 0.75, 1.00]
    smoothing_penalty: 0.05
    global_shrinkage_penalty: 0.10
    minimum_reliability: 0.0

  layer_search:
    enabled: true
    coordinate_descent: true
    max_passes: 2
    alpha_grid: [0.00, 0.25, 0.50, 0.75, 1.00]
    top_layers_only: null
    max_candidate_evaluations: 120
    pairwise_top_k: 0

  finalists:
    include: [anchor, greedy, uniform, global_best, layerwise_seed, layerwise_best]
    maximum: 6
    # robust_sequential adds complexity only when the paired bootstrap evidence
    # meets statistics.minimum_*; objective_max simply chooses the highest DEV score.
    selection_strategy: robust_sequential
    sequence: [best_endpoint, uniform, global_best, layerwise_seed, layerwise_best]

storage:
  retain_candidate_weights: [uniform, global_best, layerwise_seed, layerwise_best]
  delete_ephemeral_after_evaluation: true
  candidate_cache_dir: candidate_cache
  max_disk_gb: 80

sealed_test:
  enabled: true
  allow_repeat: false
  require_selection_freeze: true

reporting:
  make_plots: true
  write_markdown: true
  top_case_examples: 20
