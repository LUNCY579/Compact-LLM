[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rineya-tgsa-research"
version = "0.3.0"
description = "Auditable TGSA reference implementation and TGSA x multi-token-prediction study"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24"]

[project.optional-dependencies]
# `test` is the historical alias. Keep `dev` identical so CI cannot silently
# install an unknown extra and skip pytest/jsonschema.
test = ["pytest>=8", "jsonschema>=4.21"]
dev = ["pytest>=8", "jsonschema>=4.21"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tgsa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
