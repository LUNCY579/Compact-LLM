[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rineya-tgsa-research"
version = "0.1.0"
description = "Auditable reference implementation for Trajectory-Guided Sequential Attention"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tgsa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
