[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rineya-tgsa-research"
version = "0.2.0"
description = "Auditable reference implementation for Trajectory-Guided Sequential Attention"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24"]

[project.optional-dependencies]
# `test` is the historical name and stays as an alias so older invocations keep
# working. `dev` is the name every workflow and launch runbook uses. Both must
# resolve to the same pinned set: the Phase-1 launch audit failed because CI
# installed a `dev` extra that did not exist, so pytest was missing and the job
# died before the test suite ran.
# numpy is required at RUNTIME, not just for tests: `state_dict_sha256` hashes
# tensors through `Tensor.numpy()`, so the whole evidence chain depends on it.
# torch declares numpy as optional and the CPU-only wheel index does not pull
# it, which is exactly how CI failed with "Numpy is not available".
test = ["pytest>=8", "jsonschema>=4.21"]
dev = ["pytest>=8", "jsonschema>=4.21"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tgsa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
