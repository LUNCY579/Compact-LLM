[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rineya-cross-scale"
version = "0.1.0"
description = "Reproducible cross-scale Qwen3 capability-transfer research tools"
requires-python = ">=3.11"
dependencies = [
  "safetensors>=0.5",
  "torch>=2.5",
  "transformers>=4.51",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
