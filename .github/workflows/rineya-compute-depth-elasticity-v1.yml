name: CDE-001 CPU methods
on:
  push:
    branches: [research/rineya-compute-depth-elasticity-v1]
    paths:
      - 'experiments/rineya_compute_depth_elasticity_v1/**'
      - '.github/workflows/rineya-compute-depth-elasticity-v1.yml'
  pull_request:
    paths:
      - 'experiments/rineya_compute_depth_elasticity_v1/**'
      - '.github/workflows/rineya-compute-depth-elasticity-v1.yml'
permissions:
  contents: read
concurrency:
  group: cde001-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-methods:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CPU test dependencies only
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest==9.0.2
      - name: Scoped method and gradient tests
        run: python -m pytest -q experiments/rineya_compute_depth_elasticity_v1/tests
      - name: Scripted fixture smoke; no model loading
        run: python -m experiments.rineya_compute_depth_elasticity_v1 smoke
