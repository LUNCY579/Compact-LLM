name: Prune six merged binding and foundry refs
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prune-merged-research-once.yml"
jobs:
  prune:
    if: "${{ github.event.head_commit.message == 'chore: prune six binding and foundry refs' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Verify exact source tips, Git ancestry, and prune
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://api.github.com/repos/{repo}"
          candidates = [["codex/worktree-save-20261002/chatbubble-binding-integration-pilot-20260920","8e9e4ba9420ab3dc650d247bba36d47329b12ccd"],["codex/worktree-save-20261002/chatbubble-binding-mixture-pilot-20260920","f0a32c916a935852017d62846b46b080deed5c59"],["codex/worktree-save-20261002/chatbubble-compose-lane-20260918","dc511f919ce0b57dc8b20b254ce11ae0150e5316"],["codex/worktree-save-20261002/chatbubble-retention-doselora-resume-20260920","621d09ccccd82f7f16d2c13eb4c5b70643e5c961"],["codex/worktree-save-20261002/chatbubble-retention-pilot-20260917","fae9f3fed9a1387400e35b721c708b87cda27262"],["codex/rineya-dataset-evidence-20261009","01b6ae89277319a45f2f1d209a8bdc0917f5bea4"]]
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          def api(method, path, missing_ok=False):
              req = urllib.request.Request(base + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  if missing_ok and e.code == 404: return None
                  raise RuntimeError(f"{method} {path}: GitHub HTTP {e.code}") from None
          
          open_prs = api("GET", "/pulls?state=open&per_page=100")
          main_sha = api("GET", "/git/ref/heads/main")["object"]["sha"]
          print(f"Preflight {len(candidates)} historical refs against main {main_sha[:12]}")
          for branch, approved_sha in candidates:
              if branch == "main" or len(approved_sha) != 40: raise RuntimeError("Invalid ref approval")
              quote = urllib.parse.quote(branch, safe="/")
              obj = api("GET", f"/git/ref/heads/{quote}")
              if obj["object"]["sha"] != approved_sha: raise RuntimeError(f"Branch moved: {branch}")
              detail = api("GET", f"/branches/{quote}")
              if detail.get("protected"): raise RuntimeError(f"Protected branch: {branch}")
              if any(pr.get("head",{}).get("ref")==branch and pr.get("head",{}).get("repo",{}).get("full_name")==repo for pr in open_prs):
                  raise RuntimeError(f"Open PR source: {branch}")
              c = api("GET", f"/compare/main...{approved_sha}?per_page=1")
              if c.get("ahead_by") != 0 or c.get("status") not in ("behind", "identical"):
                  raise RuntimeError(f"Unmerged commits: {branch}")
              print(f"VERIFIED {branch}@{approved_sha[:12]}")
          for branch, approved_sha in candidates:
              quote = urllib.parse.quote(branch, safe="/")
              if api("GET", f"/git/ref/heads/{quote}")["object"]["sha"] != approved_sha:
                  raise RuntimeError(f"Ref moved during operation: {branch}")
              api("DELETE", f"/git/refs/heads/{quote}")
              if api("GET", f"/git/ref/heads/{quote}", missing_ok=True) is not None:
                  raise RuntimeError(f"Ref still exists: {branch}")
              print(f"DELETED {branch}")
          print("VERIFIED_PRUNED", len(candidates))
          
          PY
