name: Prune seven merged MiMo source refs (exact-SHA)
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prune-contained-once.yml"
jobs:
  prune:
    if: "${{ github.event.head_commit.message == 'chore: run one-time verified branch prune' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Verify ancestry and prune exact approved refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://api.github.com/repos/{repo}"
          candidates = [["codex/mimo-artifact-stream-budget-20260930","9d882d38d307c5a6a2cecb8075e9ae314ae879b3"],["codex/mimo-capture-fixed-input-audit-20260930","bbe2343a5817e9512a408270f9215df0116625d0"],["codex/mimo-capture-failure-accounting-20261001","07b65f3e3651788a80bcb042d0d369954fc7cd0c"],["codex/mimo-exact-prefix-capture-20261001","b379f727b06e075b7eaeef3e029583f146e7fe81"],["codex/mimo-job-containment-20261001","f4622874de970441e9d255297a72b0b671c8bdb2"],["codex/mimo-suspended-job-launch-20261001","44cbce50dfe85fb79a35eefee4918b2a0bffef9a"],["codex/mimo-supervisor-death-cpu-20261001","c42d494e751543b5fb896bbccecd16436003354d"]]
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          def api(method, path, missing_ok=False):
              req = urllib.request.Request(base + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  if missing_ok and e.code == 404:
                      return None
                  raise RuntimeError(f"{method} {path}: GitHub HTTP {e.code}") from None
          
          open_prs = api("GET", "/pulls?state=open&per_page=100")
          main_ref = api("GET", "/git/ref/heads/main")
          main_sha = main_ref["object"]["sha"]
          print(f"Checking {len(candidates)} pinned branches against main {main_sha[:12]}")
          # All-or-none preflight; no wildcard branch matching.
          for branch, expected in candidates:
              assert branch != "main" and len(expected) == 40
              quoted = urllib.parse.quote(branch, safe="/")
              ref = api("GET", f"/git/ref/heads/{quoted}")
              if ref["object"]["sha"] != expected:
                  raise RuntimeError(f"ABORT: branch {branch} moved from approved SHA")
              detail = api("GET", f"/branches/{quoted}")
              if detail.get("protected"):
                  raise RuntimeError(f"ABORT: branch {branch} is protected")
              if any(pr.get("head", {}).get("ref") == branch and pr.get("head", {}).get("repo", {}).get("full_name") == repo for pr in open_prs):
                  raise RuntimeError(f"ABORT: branch {branch} is used by an open PR")
              comparison = api("GET", f"/compare/main...{expected}?per_page=1")
              if comparison.get("status") not in ("behind", "identical") or comparison.get("ahead_by") != 0:
                  raise RuntimeError(f"ABORT: branch {branch} is not fully contained in main")
              print(f"APPROVED {branch} at {expected[:12]} — no unique commits")
          # Recheck each SHA immediately before delete. No other ref name is touched.
          deleted = []
          for branch, expected in candidates:
              quoted = urllib.parse.quote(branch, safe="/")
              latest = api("GET", f"/git/ref/heads/{quoted}")
              if latest["object"]["sha"] != expected:
                  raise RuntimeError(f"ABORT: branch {branch} moved during deletion")
              api("DELETE", f"/git/refs/heads/{quoted}")
              if api("GET", f"/git/ref/heads/{quoted}", missing_ok=True) is not None:
                  raise RuntimeError(f"FAILED: deletion not confirmed for {branch}")
              deleted.append(branch)
              print(f"DELETED {branch}")
          print(f"PRUNED {len(deleted)} / {len(candidates)} exact contained branches.")
          
          PY
