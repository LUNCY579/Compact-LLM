name: Rineya harness distillation contracts
on:
  push:
    branches: ['research/rineya-harness-distillation-v1']
    paths:
      - 'experiments/rineya_harness_distillation_v1/**'
      - 'experiments/progressive_rl_curriculum_v1/schema.py'
      - '.github/workflows/rineya-harness-distillation.yml'
  pull_request:
    paths:
      - 'experiments/rineya_harness_distillation_v1/**'
      - 'experiments/progressive_rl_curriculum_v1/schema.py'
      - '.github/workflows/rineya-harness-distillation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and adversarial tests (standard library only)
        run: python -m unittest discover -s experiments/rineya_harness_distillation_v1/tests -v
      - name: Frozen plan and synthetic protocol demo
        run: |
          python -m experiments.rineya_harness_distillation_v1 plan
          python -m experiments.rineya_harness_distillation_v1 demo --out "${{ runner.temp }}/rhd-demo" --tasks 24
          python -m experiments.rineya_harness_distillation_v1 verify --out "${{ runner.temp }}/rhd-demo"
