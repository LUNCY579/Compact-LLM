name: RVS-001 CPU contracts
on:
  push:
    branches: [research/rineya-verified-resampling-v1]
    paths:
      - experiments/rineya_verified_resampling_v1/**
      - .github/workflows/rvs-001.yml
  pull_request:
    paths:
      - experiments/rineya_verified_resampling_v1/**
      - .github/workflows/rvs-001.yml
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Standard-library and original-generator tests (no model downloads)
        run: python -m unittest discover -s experiments/rineya_verified_resampling_v1/tests -v
      - name: Full 128-parent synthetic plumbing demonstration
        run: python -m experiments.rineya_verified_resampling_v1 demo --out /tmp/rvs-demo --parents 128
      - name: Verify native permission denial without model imports
        run: python -m experiments.rineya_verified_resampling_v1 doctor
