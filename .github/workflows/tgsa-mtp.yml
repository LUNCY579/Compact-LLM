name: TGSA plus multi-token prediction

on:
  push:
    branches:
      - research/tgsa-mtp-rineya-complementarity-v1
    paths:
      - "Rineya_Trajectory_Guided_Sequential_Attention_Lab_v1/**"
      - "Rineya_TGSA_Retrofit_v1/**"
      - ".github/workflows/tgsa-mtp.yml"
  pull_request:
    paths:
      - "Rineya_Trajectory_Guided_Sequential_Attention_Lab_v1/**"
      - "Rineya_TGSA_Retrofit_v1/**"
      - ".github/workflows/tgsa-mtp.yml"
  workflow_dispatch:
    inputs:
      run_development_matrix:
        description: "Run the 3-seed development competence matrix on a self-hosted tgsa runner"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tgsa-mtp-${{ github.ref }}
  cancel-in-progress: false

env:
  LAB: Rineya_Trajectory_Guided_Sequential_Attention_Lab_v1
  RETROFIT: Rineya_TGSA_Retrofit_v1
  SMOKE_CONFIG: Rineya_Trajectory_Guided_Sequential_Attention_Lab_v1/configs/phase2_tgsa_mtp_smoke.json
  DEV_CONFIG: Rineya_Trajectory_Guided_Sequential_Attention_Lab_v1/configs/phase2_tgsa_mtp_development.json
  PYTHONUNBUFFERED: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  unit-and-smoke:
    name: Focused tests and closed smoke evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out full lineage
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ${{ env.LAB }}/pyproject.toml
            ${{ env.RETROFIT }}/pyproject.toml

      - name: Install CPU runtime and both editable packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1"
          python -m pip install -e "${LAB}[dev]"
          python -m pip install -e "${RETROFIT}[dev,hf]"
          python - <<'PY'
          import importlib.util
          import sys
          missing = [name for name in ("torch", "numpy", "pytest", "jsonschema", "tgsa", "rineya_tgsa") if importlib.util.find_spec(name) is None]
          if missing:
              print(f"::error::missing runtime modules: {missing}")
              sys.exit(1)
          print("combined editable environment resolved")
          PY

      - name: Run TGSA MTP focused tests
        run: |
          python -m pytest \
            "${LAB}/tests/test_mtp.py" \
            "${LAB}/tests/test_phase2_data.py" \
            "${LAB}/tests/test_phase2_model.py" \
            "${LAB}/tests/test_phase2_decode.py" \
            "${LAB}/tests/test_phase2_analysis.py" \
            "${RETROFIT}/tests/test_mtp_adapter.py" \
            -q --tb=short

      - name: Run pre-existing TGSA regression suite
        run: |
          python -m pytest "${LAB}/tests" -q --tb=short --durations=15

      - name: Run pre-existing retrofit regression suite
        run: |
          python -m pytest "${RETROFIT}/tests" -q --tb=short --durations=15

      - name: Execute non-evidentiary paired smoke matrix
        run: |
          rm -rf ci_artifacts/tgsa_mtp_smoke
          mkdir -p ci_artifacts/tgsa_mtp_smoke
          python "${LAB}/scripts/run_phase2_mtp_study.py" \
            --config "${SMOKE_CONFIG}" \
            --dataset-dir "ci_artifacts/tgsa_mtp_smoke/dataset" \
            --output-dir "ci_artifacts/tgsa_mtp_smoke/study"

      - name: Verify closed evidence chain and final smoke gate
        run: |
          python "${LAB}/scripts/verify_phase2_mtp_evidence.py" \
            --config "${SMOKE_CONFIG}" \
            --dataset-dir "ci_artifacts/tgsa_mtp_smoke/dataset" \
            --output-dir "ci_artifacts/tgsa_mtp_smoke/study"

      - name: Validate Phase-2 JSON schemas and claim contracts
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import jsonschema

          lab = Path(os.environ["LAB"])
          root = Path("ci_artifacts/tgsa_mtp_smoke/study")
          pairs = [
              (lab / "evidence/phase2_matrix.schema.json", root / "matrix_manifest.json"),
              (lab / "evidence/phase2_verification.schema.json", root / "evidence_verification.json"),
          ]
          matrix = json.loads((root / "matrix_manifest.json").read_text(encoding="utf-8"))
          for entry in matrix["runs"]:
              pairs.append(
                  (
                      lab / "evidence/phase2_run.schema.json",
                      root / entry["manifest"],
                  )
              )
          for schema_path, target_path in pairs:
              jsonschema.validate(
                  json.loads(target_path.read_text(encoding="utf-8")),
                  json.loads(schema_path.read_text(encoding="utf-8")),
              )

          verification = json.loads((root / "evidence_verification.json").read_text(encoding="utf-8"))
          gate = json.loads((root / "gate.json").read_text(encoding="utf-8"))
          competence = json.loads((root / "competence_report.json").read_text(encoding="utf-8"))
          assert verification["passed"] is True, verification["errors"]
          assert verification["checks"]["paired_initialization"] is True
          assert verification["checks"]["all_primary_decodes_exact"] is True
          assert gate["verdict"] == "SMOKE_ONLY", gate
          assert gate["checks"]["exact_decode_equivalence"] is True
          assert gate["checks"]["main_path_initialization_neutral"] is True
          # The tiny budget is intentionally not promoted into a competence claim.
          assert competence["verdict"] in {"GO", "NO_GO"}
          assert matrix["confirmatory"] is False
          print(f"validated {len(pairs)} Phase-2 artifacts")
          PY

      - name: Upload smoke evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tgsa-mtp-smoke-${{ github.run_id }}
          path: ci_artifacts/tgsa_mtp_smoke
          if-no-files-found: warn
          retention-days: 21

  development-matrix:
    name: Three-seed development competence matrix
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_development_matrix }}
    needs: unit-and-smoke
    runs-on:
      - self-hosted
      - tgsa
    timeout-minutes: 1440

    steps:
      - name: Check out full lineage
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install combined packages
        run: |
          python -m pip install -e "${LAB}[dev]"
          python -m pip install -e "${RETROFIT}[dev,hf]"

      - name: Refuse a populated evidence root
        shell: bash
        run: |
          ROOT="artifacts/tgsa_mtp_development_${GITHUB_RUN_ID}"
          test ! -e "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Run development matrix
        run: |
          python "${LAB}/scripts/run_phase2_mtp_study.py" \
            --config "${DEV_CONFIG}" \
            --dataset-dir "${ROOT}/dataset" \
            --output-dir "${ROOT}/study"
          python "${LAB}/scripts/verify_phase2_mtp_evidence.py" \
            --config "${DEV_CONFIG}" \
            --dataset-dir "${ROOT}/dataset" \
            --output-dir "${ROOT}/study"

      - name: Upload development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tgsa-mtp-development-${{ github.run_id }}
          path: ${{ env.ROOT }}
          if-no-files-found: error
          retention-days: 30
