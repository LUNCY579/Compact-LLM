name: RAB-001 architecture foundation
on:
  push:
    branches: [research/benchmark-001-architecture-ced40-v1]
    paths:
      - 'experiments/architecture_benchmark_001/**'
      - '.github/workflows/benchmark-001-architecture.yml'
  pull_request:
    paths:
      - 'experiments/architecture_benchmark_001/**'
      - '.github/workflows/benchmark-001-architecture.yml'
permissions:
  contents: read
concurrency:
  group: rab001-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mechanics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install isolated CPU and native parity dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r experiments/architecture_benchmark_001/requirements-native.txt
          python -c "import transformers; from transformers import Qwen3ForCausalLM; assert transformers.__version__ == '4.51.3'"
      - name: Execute mechanical tests, including random native Qwen parity
        run: |
          mkdir -p /tmp/rab001
          python -m pytest -q experiments/architecture_benchmark_001/tests --junitxml=/tmp/rab001/junit.xml
          python -m experiments.architecture_benchmark_001.receipt --junit /tmp/rab001/junit.xml --out /tmp/rab001/MECHANICAL.json --require-native --source-revision "$GITHUB_SHA"
          python -m experiments.architecture_benchmark_001 matrix > /tmp/rab001/matrix.json
          python -m experiments.architecture_benchmark_001 status > /tmp/rab001/status.json
      - name: Preserve evidence, including failed test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RAB-001-mechanics-${{ github.sha }}
          path: /tmp/rab001/
          if-no-files-found: warn
          retention-days: 90
  foundation-tag:
    needs: mechanics
    if: github.event_name == 'push' && github.repository == 'LUNCY579/ChatBubble' && github.ref == 'refs/heads/research/benchmark-001-architecture-ced40-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Publish the immutable first foundation tag, never a model-success tag
        env:
          TAG: benchmark-001-architecture-ced40-foundation-v1
        run: |
          set -euo pipefail
          existing="$(git ls-remote --tags origin "refs/tags/$TAG")"
          if [ -n "$existing" ]; then
            echo "Foundation tag already exists; preserving it without force or overwrite."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" "$GITHUB_SHA" -m 'RAB-001: first CED40 architecture benchmark foundation. Mechanical and random-native tests only. No official-model baseline, recovery, sealed evaluation, or efficacy result is implied.'
          git push origin "refs/tags/$TAG"
