name: rineya_puzzle_reasoning_curriculum_v1
base_dataset:
  train: data/train.jsonl
  validation: data/validation.jsonl
  frozen_test: data/test.jsonl
  frozen_challenge: data/challenge.jsonl

principles:
  - learn_correct_reasoning_before_optimizing_brevity
  - never_train_on_test_or_challenge
  - preserve_family_balance_in_every_stage
  - monitor_exact_accuracy_and_visible_output_length_together

stages:
  - name: reasoning_acquisition
    source_filter:
      difficulty: [easy]
    views:
      think_then_short: 1.0
    suggested_epochs: 1
    max_sequence_length: 1024
    notes: Learn verified operations and exact answer formats.

  - name: mixed_reasoning
    source_filter:
      difficulty: [easy, medium]
    views:
      think_then_short: 0.70
      short_only: 0.30
    suggested_epochs: 2
    max_sequence_length: 1024
    notes: Interleave full supervision with concise behavioral targets.

  - name: response_compression
    source_filter:
      difficulty: [easy, medium]
    views:
      short_only: 1.0
    suggested_epochs: 1
    max_sequence_length: 768
    notes: Restore Rineya's public short-response identity; stop if reasoning accuracy falls materially.

  - name: optional_concision_preference
    optional: true
    views:
      preference_pair: 1.0
    notes: Apply only with a correctness gate and after successful SFT.

evaluation:
  checkpoint_selection_split: validation
  final_splits: [test, challenge]
  primary_metrics:
    - normalized_exact_accuracy
    - macro_accuracy_by_family
    - worst_family_accuracy
    - challenge_accuracy
    - mean_extracted_output_words
  regression_gates:
    maximum_validation_accuracy_drop_during_compression: 0.02
    maximum_mean_final_words: 8
    require_all_families_reported: true

starting_hyperparameter_ranges:
  disclaimer: Tune on validation; these are conservative starting ranges, not universal optima.
  lora_or_dora:
    learning_rate: [0.00002, 0.00010]
    effective_batch_tokens: [8192, 32768]
    warmup_ratio: [0.03, 0.08]
    gradient_clip_norm: 1.0
  full_parameter:
    learning_rate: [0.000003, 0.00002]
    effective_batch_tokens: [8192, 32768]
    warmup_ratio: [0.03, 0.08]
    gradient_clip_norm: 1.0
