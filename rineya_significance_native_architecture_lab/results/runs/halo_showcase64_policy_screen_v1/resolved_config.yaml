arms:
- budget: 256
  exponent: 0.0
  id: B4_POS
  label: positional_recency_ranking_matched_budget
  policy: position
  question: 'Does content significance beat pure recency at identical budget? This
    is the decisive control: if B4_POS matches B3, the selection signal is contributing
    nothing beyond position.'
  recent: 64
  sinks: 4
- budget: 256
  exponent: 0.5
  id: E05
  label: exponent_one_half
  policy: significance
  question: Is the normalization exponent tunable between the tested e=0 and e=1?
  recent: 64
  sinks: 4
- budget: 256
  exponent: 2.0
  id: E20
  label: exponent_two
  policy: significance
  question: Does stronger exposure normalization help or overcorrect?
  recent: 64
  sinks: 4
- budget: 256
  exponent: 1.0
  id: R008
  label: narrow_recency_wide_heavy
  policy: significance
  question: With 244 content-selected slots instead of 188, does significance selection
    recover early and middle needles?
  recent: 8
  sinks: 4
- budget: 256
  exponent: 1.0
  id: R192
  label: wide_recency_narrow_heavy
  policy: significance
  question: With only 60 content-selected slots, does accuracy fall? If it does not,
    recency is carrying the result.
  recent: 192
  sinks: 4
- budget: 512
  exponent: 1.0
  id: B512
  label: double_budget
  policy: significance
  question: Where is the capacity knee? Does doubling the budget recover B0?
  recent: 64
  sinks: 4
benchmark:
  case_selection: complete_split_no_subsetting
  expected_case_count: 64
  name: Rineya Long Context Demo showcase split (complete)
  prompt_only_during_inference: true
  split: showcase
  truncation: forbidden
cache:
  compression_chunk_tokens: 256
experiment:
  classification: EXPLORATORY_SCREEN
  compute_tier: B
  name: halo_showcase64_cornerstone1_policy_screen
  purpose: Locate the practical limit of Cornerstone-1 selection on the 64-case showcase
    split. The showcase-64 evaluation showed zero compression loss on late-needle
    cases and heavy loss on early, middle, and distributed needles, which is the signature
    of a positional recency window rather than content-significance selection. These
    arms test that directly at matched budget, sweep the normalization exponent, and
    map the capacity curve.
