schema_version: "1.0"

experiment:
  name: halo_showcase64_span_preservation_screen
  classification: EXPLORATORY_SCREEN
  compute_tier: B
  purpose: >-
    Test whether contiguous-span preservation repairs the specific failure mode
    observed in the showcase-64 evaluation. Of the eleven cases Halo answered
    correctly at full cache and lost under B3, four were partial multi-token
    entity corruptions -- "Lucan Tern" became "Lucan T. T", "Jasper Upton"
    became "Jasper Ullman" -- where the leading name token survived selection
    and the trailing token was evicted. Per-token independent top-k selection
    predicts exactly this. Max-pooled scores propagate a high score to adjacent
    entries and should keep multi-token entities intact.

mechanism_boundary: >-
  Score pooling is a CORNERSTONE-2 span factor, not Cornerstone 1. Any gain
  measured here must be reported as a separate span factor and must never be
  credited to the Cornerstone-1 significance matrix. The pool_width=1 reference
  arm is the isolated Cornerstone-1 configuration.

protocol:
  execution_mode: closed_loop_model_execution
  answer_key_access: after_all_inference_and_unscored_artifact
  inferential_statistics: false
  broad_claims: false
  registration: none_this_run_is_exploratory

paths:
  base: repository_root
  model: Rineya_Published_Cores/Rineya-Halo-1.2.0-devfreeze
  tokenizer: Rineya_Published_Cores/Rineya-Halo-1.2.0-devfreeze
  prompts: Rineya_Long_Context_Demo_v1/data/showcase_prompts.jsonl
  answer_key: Rineya_Long_Context_Demo_v1/data/showcase_answer_key.jsonl
  output_root: rineya_significance_native_architecture_lab/results/runs/halo_showcase64_span_screen_v1

model:
  core_id: rineya.core.halo.v1.2.0-devfreeze.28L.qwen3-crossdepth-v1-5e4-v2-1e4
  allowed_core_ids:
    - rineya.core.halo.v1.2.0-devfreeze.28L.qwen3-crossdepth-v1-5e4-v2-1e4
  expected_source_base: Qwen3-0.6B
  expected_architecture: Qwen3ForCausalLM
  expected_layers: 28
  expected_hidden_size: 1024
  expected_query_heads: 16
  expected_kv_heads: 8
  expected_head_dim: 128
  expected_vocab_size: 151936
  trust_remote_code: false
  checkpoint_files:
    weights: model.safetensors
    tokenizer: tokenizer.json
    config: config.json
    chat_template: chat_template.jinja
    core: CORE.json
    generation_config: generation_config.json
    tokenizer_config: tokenizer_config.json
  expected_hashes:
    weights: 38fb96fe286776919032c4418eef0a2534e2c2c2865c1465cc9dd4cfe7e36544
    tokenizer: be75606093db2094d7cd20f3c2f385c212750648bd6ea4fb2bf507a6a4c55506
    config: 2284cc1687a4f4f6e3a64a13dfcf7562e592b951afa2f91244cc7b212c9cfb85
    chat_template: 51fa65c79bb57f058dc7ef8734884bd325fe9d45bb03a61bfef59785d3bc2da9
    core: 8317f76d375c3dc09bf0316f5f3452d5a66cba126af235050adc818d4c51d56b
    generation_config: 90d5f4e22a088a995712d44c519d1902acab0988a8f6087dbf73f127cf40ef48
    tokenizer_config: 1f18fb516a5b9ec1286b09ef8df6cbe736ad8298c77d99953d85f182572b273e

benchmark:
  name: Rineya Long Context Demo showcase split (complete)
  split: showcase
  expected_case_count: 64
  case_selection: complete_split_no_subsetting
  prompt_only_during_inference: true
  truncation: forbidden

prompt:
  rendering: chat_template
  enable_thinking: false
  add_generation_prompt: true
  add_special_tokens_after_rendering: false

runtime:
  device: cpu
  dtype: bfloat16
  attention_implementation: sdpa
  batch_size: 1
  seed: 17
  deterministic: true
  decoding: manual_greedy
  max_new_tokens: 24
  verify_query_rollback: true

query:
  mode: conditioned
  rendering: raw_question_no_special_tokens
  max_tokens: 64
  probe_schedule: every_nonfinal_chunk_boundary
  access_fairness: identical_across_all_arms

significance:
  enabled: true
  enabled_for_selection: true
  exposure_mode: realized
  selection_granularity: kv_head

cache:
  compression_chunk_tokens: 256

arms:
  - id: P1_REF
    label: cornerstone1_isolated_reference
    policy: significance
    exponent: 1.0
    budget: 256
    sinks: 4
    recent: 64
    pool_width: 1
    question: >-
      Internal consistency check. This is bit-for-bit the B3 configuration of
      the showcase-64 evaluation and must reproduce its 19/64.
  - id: P3
    label: span_pool_width_3
    policy: significance
    exponent: 1.0
    budget: 256
    sinks: 4
    recent: 64
    pool_width: 3
    question: Does a 3-wide span pool keep two-token entities intact?
  - id: P5
    label: span_pool_width_5
    policy: significance
    exponent: 1.0
    budget: 256
    sinks: 4
    recent: 64
    pool_width: 5
    question: Does a wider pool help further, or start wasting budget on neighbours?
  - id: P7
    label: span_pool_width_7
    policy: significance
    exponent: 1.0
    budget: 256
    sinks: 4
    recent: 64
    pool_width: 7
    question: Where does span widening stop paying for itself?

outputs:
  resolved_config: resolved_config.yaml
  manifest: manifest.json
  cases: cases.jsonl
  summary: summary.json
