  model: Rineya_Published_Cores/Rineya-Halo-1.2.0-devfreeze
  tokenizer: Rineya_Published_Cores/Rineya-Halo-1.2.0-devfreeze
  benchmark: null
  answer_key: null
  output_root: rineya_significance_native_architecture_lab/results/runs/halo_deferred_gpu

model:
  core_id: rineya.core.halo.v1.2.0-devfreeze.28L.qwen3-crossdepth-v1-5e4-v2-1e4
  family_scope: published_qwen3_0.6b
  excluded_active_models: [rineya_r2, aegis]
  expected_architecture: Qwen3ForCausalLM
  expected_layers: 28
  expected_hidden_size: 1024
  expected_intermediate_size: 3072
  expected_query_heads: 16
  expected_kv_heads: 8
  expected_head_dim: 128
  expected_vocab_size: 151936
  expected_max_position_embeddings: 40960
  expected_hashes:
    weights: 38fb96fe286776919032c4418eef0a2534e2c2c2865c1465cc9dd4cfe7e36544
    tokenizer: be75606093db2094d7cd20f3c2f385c212750648bd6ea4fb2bf507a6a4c55506
    config: 2284cc1687a4f4f6e3a64a13dfcf7562e592b951afa2f91244cc7b212c9cfb85
  trust_remote_code: false
  require_runtime_hashes: true

runtime:
  device: cuda
  dtype: bfloat16
  attention_implementation: sdpa
  batch_size: 1
  deterministic: true
  greedy: true
  max_new_tokens: 64
  allow_cpu_offload: false
  record_peak_vram: true
  record_peak_rss: true

candidates:
  - id: B0_full_cache
    enabled_after_all_gates: true
  - id: B2_raw
    enabled_after_all_gates: true
  - id: B3_normalized
    enabled_after_all_gates: true
  - id: one_frozen_exploratory_architecture
    enabled_after_all_gates: false

significance:
  enabled: true
  exponent: 1.0
  exposure_mode: realized
  query_conditioned: true
  source_semantics_verified: true
  runtime_role: local_recorder
  score_pooling:
    enabled: false
    width: 1
  selection_granularity: kv_head
  stable_tie_break: absolute_position_then_entry_id

query:
  mode: conditioned
  max_tokens: 64

cache:
  # Report as retained history + active chunk + transient query. The legacy
  # total_budget_slots key aliases retained_history_budget for validation.
  retained_history_budget: 2048
  total_budget_slots: 2048
  active_chunk_tokens: 1024
  max_query_tokens: 64
  max_resident_entries_after_full_chunk: 3072
  max_transient_entries: 3136
  sink_tokens: 64
  recent_tokens: 256
  compression_chunk_tokens: 1024
  compress_only_at_boundaries: true
  matched_total_persistent_bytes: true

attention_prior:
  enabled: false
  lambda: 0.0

memory_slots:
  enabled: false
  count: 0

controller:
  enabled: false
  type: none

benchmark:
  suite: halo_cpu_survivors_only_after_registration
  context_tokens: [8192, 16384, 32768]
  evidence_depths: [0.10, 0.50, 0.90]
  candidate_seeds: [101, 211, 307, 401]
  exact_evidence_unit: PENDING_BEFORE_PROTOCOL_FREEZE
  exact_evidence_metric: PENDING_BEFORE_PROTOCOL_FREEZE
  cluster_id_definition: PENDING_BEFORE_PROTOCOL_FREEZE
  split_and_resampling_unit: cluster_id

analysis:
  cluster_aware: true
  primary_metric: PENDING_BEFORE_PROTOCOL_FREEZE
  capability_reference: B0
  primary_treatment: B3
  primary_control: B2

gates:
  confirmatory_protocol_registered: false
  exact_evidence_scorer_validated: false
  cluster_plan_frozen: false
  unit_and_identity_tests_pass: false
  cpu_screen_complete: false
  no_open_invariant_failures: false
  frozen_candidate_list_written: false
  model_tokenizer_and_config_hashes_recorded: false
  benchmark_and_config_hashes_recorded: false

outputs:
  resolved_config: resolved_config.yaml
  manifest: manifest.json
  predictions: predictions.jsonl
  cases: cases.jsonl
  summary: summary.json
  traces: traces
  statistics: statistics
  figures: figures
