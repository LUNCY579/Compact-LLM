model:
  core_id: rineya.core.halo.v1.2.0-devfreeze.28L.qwen3-crossdepth-v1-5e4-v2-1e4
  checkpoint_role: primary_halo
  family_scope: published_qwen3_0.6b
  excluded_active_models: [rineya_r2, aegis]
  expected_architecture: Qwen3ForCausalLM
  expected_layers: 28
  expected_hidden_size: 1024
  expected_intermediate_size: 3072
  expected_query_heads: 16
  expected_kv_heads: 8
  expected_head_dim: 128
  expected_vocab_size: 151936
  expected_max_position_embeddings: 40960
  expected_hashes:
    weights: 38fb96fe286776919032c4418eef0a2534e2c2c2865c1465cc9dd4cfe7e36544
    tokenizer: be75606093db2094d7cd20f3c2f385c212750648bd6ea4fb2bf507a6a4c55506
    config: 2284cc1687a4f4f6e3a64a13dfcf7562e592b951afa2f91244cc7b212c9cfb85
  trust_remote_code: false
  require_runtime_hashes: true

runtime:
  device: cpu
  dtype: bfloat16
  attention_implementation: sdpa
  batch_size: 1
  deterministic: true
  greedy: true
  max_new_tokens: 32
  disable_thinking: true

conditions:
  - id: B0
    policy: full_cache
    exponent: null
  - id: B2
    policy: significance
    exponent: 0.0
  - id: B3
    policy: significance
    exponent: 1.0
  - id: B4
    policy: positional_sink_recent
    exponent: null
  - id: B5
    policy: age_derived_exposure
    exponent: 1.0
  - id: B6
    policy: shuffled_significance
    exponent: 1.0
    randomization: seeded_per_cluster_case
  - id: B7
    policy: random_selection
    exponent: null
    randomization: seeded_per_cluster_case
  - id: B8
    policy: oracle_evidence_retention
    exponent: null
    synthetic_only: true
    oracle_access: true

significance:
  enabled: true
  exponent: 1.0
  exposure_mode: realized
  query_conditioned: true
  source_semantics_verified: true
  runtime_role: local_recorder
  score_pooling:
    enabled: false
    width: 1
  selection_granularity: kv_head
  stable_tie_break: absolute_position_then_entry_id

query:
  mode: conditioned
  rendering: PENDING_BEFORE_PROTOCOL_FREEZE
  probe_schedule: every_nonfinal_chunk_boundary
  max_tokens: 32

cache:
  # Report as retained history + active chunk + transient query. The legacy
  # total_budget_slots key is currently the config validator's compatibility
  # alias for retained_history_budget; it is not total live residency.
  retained_history_budget: 1024
  total_budget_slots: 1024
  active_chunk_tokens: 512
  max_query_tokens: 32
  max_resident_entries_after_full_chunk: 1536
  max_transient_entries: 1568
  sink_tokens: 64
  recent_tokens: 256
  compression_chunk_tokens: 512
  compression_round_secondary_chunk_tokens: [512, 1024, 2048]
  compress_only_at_boundaries: true
  matched_total_persistent_bytes: true
  positional_control_reserves_auxiliary_bytes: true

attention_prior:
  enabled: false
  lambda: 0.0

memory_slots:
  enabled: false
  count: 0

controller:
  enabled: false
  type: none

benchmark:
  suite: generated_halo_confirmatory_v1_draft
  task_families: [R1, R2, R3, R4]
  benchmark_stage_r2_is_not_model_r2: true
  context_tokens: [4096]
  evidence_depths: [0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95]
  candidate_seeds: [101, 211, 307, 401]
  calibration_independent_clusters: 32
  calibration_clusters_per_family: 8
  candidate_confirmatory_independent_clusters: 64
  cases_per_cell: null
  total_unique_cases: null
  prompt_and_evaluation_views_separate: true
  exact_evidence_unit: PENDING_BEFORE_PROTOCOL_FREEZE
  exact_evidence_metric: PENDING_BEFORE_PROTOCOL_FREEZE
  cluster_id_definition: family_and_latent_seed
  split_unit: cluster_id
  keep_policy_depth_schedule_variants_in_cluster: true

analysis:
  primary_treatment: B3
  primary_control: B2
  capability_reference: B0
  primary_metric: PENDING_BEFORE_PROTOCOL_FREEZE
  primary_estimand_direction: B3_minus_B2
  key_task_secondary: capability_conditioned_exact_accuracy
  cluster_aware: true
  bootstrap_or_randomization_unit: cluster_id
  bootstrap_resamples: 10000
  confidence_level: 0.95
  paired_exact_test: cluster_sign_flip_two_sided
  multiplicity_rule: PENDING_BEFORE_PROTOCOL_FREEZE
  minimum_primary_eligible_clusters: 12
  minimum_eligible_clusters_per_family: 2

gates:
  protocol_registered: false
  exact_evidence_scorer_validated: false
  cluster_plan_frozen: false
  case_matrix_frozen: false
  unit_and_identity_tests_pass: false
  no_open_invariant_failures: false
  model_and_tokenizer_hashes_recorded_for_run: false

outputs:
  resolved_config: resolved_config.yaml
  manifest: manifest.json
  predictions: predictions.jsonl
  cases: cases.jsonl
  summary: summary.json
  traces: traces
  statistics: statistics
  figures: figures
