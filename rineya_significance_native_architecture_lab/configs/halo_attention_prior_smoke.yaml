schema_version: "1.0"

experiment:
  name: halo_soft_significance_attention_cpu_smoke
  status: NOT_RUN
  evidence_class: NOT_RUN
  compute_tier: B
  purpose: >-
    Verify bit-exact C0 disablement and finite closed-loop execution for one tiny
    normalized historical-significance prior on the published Halo 0.6B core.

protocol:
  execution_mode: closed_loop_model_execution
  scope: runtime_and_finite_output_compatibility_only
  quality_evaluation: false
  confirmatory: false

paths:
  base: repository_root
  model: Rineya_Published_Cores/Rineya-Halo-1.2.0-devfreeze
  tokenizer: Rineya_Published_Cores/Rineya-Halo-1.2.0-devfreeze
  benchmark: Rineya_Long_Context_Demo_v1/data/showcase_prompts.jsonl
  output_root: rineya_significance_native_architecture_lab/results/runs/halo_attention_prior_smoke_v1

model:
  core_id: rineya.core.halo.v1.2.0-devfreeze.28L.qwen3-crossdepth-v1-5e4-v2-1e4
  expected_architecture: Qwen3ForCausalLM
  expected_layers: 28
  expected_hidden_size: 1024
  expected_query_heads: 16
  expected_kv_heads: 8
  expected_head_dim: 128
  expected_vocab_size: 151936
  expected_hashes:
    weights: 38fb96fe286776919032c4418eef0a2534e2c2c2865c1465cc9dd4cfe7e36544
    tokenizer: be75606093db2094d7cd20f3c2f385c212750648bd6ea4fb2bf507a6a4c55506
    config: 2284cc1687a4f4f6e3a64a13dfcf7562e592b951afa2f91244cc7b212c9cfb85
  trust_remote_code: false

runtime:
  device: cpu
  dtype: bfloat16
  attention_implementation: sdpa
  seed: 1701
  deterministic: true
  max_input_tokens: 24
  chunk_size: 8
  observation_window: 8
  answer_generation: false

significance:
  enabled: true
  exponent: 1.0
  exposure_mode: realized
  query_conditioned: false
  score_pooling:
    enabled: false
    width: 1

query:
  mode: agnostic

cache:
  # Larger than this 24-token smoke: the prior is isolated from eviction.
  total_budget_slots: 32
  retained_history_budget: 32
  sink_tokens: 0
  recent_tokens: 0
  compression_chunk_tokens: 8
  expected_evictions: 0
  matched_total_persistent_bytes: not_applicable_runtime_smoke

attention_prior:
  enabled: true
  mode: normalized
  transform: clipped_z_score
  lambda: 0.01
  per_layer_lambdas: null
  clip: 2.0
  epsilon: 0.000001
  max_abs_lambda: 0.25
  shuffle_seed: 1701
  access:
    query: agnostic
    answer: none
    oracle_evidence: none
    future_tokens: none
    future_hidden_states: none
  smoke_conditions:
    - id: baseline_no_prior
      lambda: null
      significance_recording: false
    - id: C0_zero_bias
      lambda: 0.0
    - id: C1_tiny_global_lambda
      lambda: 0.01
  implemented_not_run_controls:
    - C2_per_layer_lambdas
    - C4_shuffled_normalized_significance
    - C5_raw_S
    - C6_age_only
  deferred_control:
    id: C3_cpu_trained_per_layer_lambdas
    reason: No training or quality tuning is authorized by this bounded compatibility smoke.

memory_slots:
  enabled: false
  count: 0

controller:
  enabled: false
  type: none

claims:
  allowed:
    - C0 is bit-exact to the same recorded full-cache execution.
    - A lambda 0.01 normalized prior completes with finite outputs on one tiny Halo prompt.
  prohibited:
    - answer quality improves
    - long-context reasoning improves
    - feedback is safe beyond this bounded runtime smoke
    - normalized significance beats raw, shuffled, or age controls
