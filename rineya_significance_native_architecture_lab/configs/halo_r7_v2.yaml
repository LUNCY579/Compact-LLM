  tokenizer_sha256: be75606093db2094d7cd20f3c2f385c212750648bd6ea4fb2bf507a6a4c55506
benchmark:
  family: R7
  generator_version: r7-v2.0.0
  # Consecutive seeds are prospectively balanced by the generator's parity and
  # branch schedule: YES/NO x branch A/B has two clusters per cell.
  seeds: [410, 411, 412, 413, 414, 415, 416, 417]
  clustered_evidence_depths: [0.10, 0.50, 0.90]
  fixed_layouts:
    [all_early, all_middle, all_late, early_late, early_middle_late, uniformly_distributed, random]
  fixed_layout_requested_depth: 0.50
  filler_count: 32
  split: tier_a_r7_v2_design
  expected_cases: 80
  expected_independent_clusters: 8
  expected_answer_counts: {"YES": 40, "NO": 40}
  screen:
    context_layout: clustered
    requested_evidence_depth: 0.50
    expected_independent_clusters: 8
    expected_answer_counts: {"YES": 4, "NO": 4}
prompt:
  rendering: halo_chat_template
  enable_thinking: false
  system: Use only the supplied context. Apply the stated rule and override policy exactly. Return only YES or NO.
significance:
  enabled: false
  exponent: 1.0
  score_pooling: {enabled: false, width: 1}
query: {mode: agnostic}
cache: {total_budget_slots: 0, sink_tokens: 0, recent_tokens: 0}
