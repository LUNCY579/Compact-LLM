schema_version: "1.0"
experiment:
  name: halo_r7_corrected_rule_override_dataset_v2
  status: BUILD_ONLY
  compute_tier: A
protocol:
  execution_mode: open_loop_trace_simulation
  answer_selection: structural_before_model_execution
paths:
  base: repository_root
  tokenizer: Rineya_Published_Cores/Rineya-Halo-1.2.0-devfreeze
  output_root: rineya_significance_native_architecture_lab/results/benchmarks/halo_r7_v2
  frozen_invalid_v1: rineya_significance_native_architecture_lab/results/benchmarks/halo_r1_r8_ladder_v1
model:
