conditions:
  - {id: B0, policy: full_cache, exponent: null}
  - {id: B2, policy: significance, exponent: 0.0}
  - {id: B3, policy: significance, exponent: 1.0}

prompt:
  rendering: chat_template
  enable_thinking: false
  add_generation_prompt: true
  add_special_tokens_after_rendering: false

runtime:
  device: cpu
  dtype: bfloat16
  attention_implementation: sdpa
  batch_size: 1
  seed: 17
  deterministic: true
  decoding: manual_greedy
  max_new_tokens: 24
  verify_query_rollback: true

query:
  mode: conditioned
  rendering: raw_question_no_special_tokens
  max_tokens: 64
  probe_schedule: every_nonfinal_chunk_boundary
  access_fairness: identical_within_each_core

significance:
  enabled: true
  exponent: 1.0
  exposure_mode: realized_event_count
  score_pooling: {enabled: false, width: 1}

cache:
  total_budget_slots: 256
  retained_history_budget: 256
  sink_tokens: 4
  recent_tokens: 64
  compression_chunk_tokens: 256
  final_chunk_left_resident: true

analysis:
  comparisons: [B3_minus_B2, B3_minus_B0, B2_minus_B0]
  binary_test: exact_two_sided_sign
  report_case_and_scenario_pack_units: true
  prohibit_cross_core_pooling: true

excluded_from_active_scope:
  - Rineya/R2 checkpoints
  - Rineya Aegis
