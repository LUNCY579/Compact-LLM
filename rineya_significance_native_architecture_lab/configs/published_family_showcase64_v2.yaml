schema_version: "1.0"

experiment:
  name: published_qwen3_0_6b_family_showcase64_v2
  classification: BOUNDED_EXPLORATORY_FAMILY_SEPARATE_IDENTITIES
  compute_tier: B
  purpose: >-
    Complete answer-level B0/B2/B3 evidence for the four secondary published
    Qwen3-0.6B Rineya cores. Each core is analyzed separately; no pooled family
    efficacy claim is allowed.

protocol:
  execution_mode: closed_loop_model_execution
  inference_outputs_answer_blind: true
  answer_key_access: aggregate_finalizer_only_after_all_raw_segments_exist
  independence_unit: scenario_pack
  registration: none_exploratory
  broad_family_claims: false

paths:
  base: repository_root
  prompts: Rineya_Long_Context_Demo_v1/data/showcase_prompts.jsonl
  answer_key: Rineya_Long_Context_Demo_v1/data/showcase_answer_key.jsonl
  part1_complete_raw: rineya_significance_native_architecture_lab/results/runs/halo_family_showcase64_v1_part1/complete_cores.jsonl
  segment_root: rineya_significance_native_architecture_lab/results/runs/published_family_showcase64_v2_segments
  final_output: rineya_significance_native_architecture_lab/results/runs/published_family_showcase64_v2

benchmark:
  name: Rineya Long Context Demo showcase split (complete)
  split: showcase
  expected_case_count: 64
  expected_scenario_packs: 16
  variants_per_pack: 4
  truncation: forbidden

model_geometry:
  expected_architecture: Qwen3ForCausalLM
  expected_layers: 28
  expected_hidden_size: 1024
  expected_query_heads: 16
  expected_kv_heads: 8
  expected_head_dim: 128
  expected_vocab_size: 151936

