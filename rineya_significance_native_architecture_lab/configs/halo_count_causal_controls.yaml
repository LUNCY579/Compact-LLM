schema_version: "1.0"

experiment:
  name: halo_closed_loop_exposure_count_causal_controls_v1
  classification: EXPLORATORY_CAUSAL_CONTROL
  compute_tier: B
  status: NOT_RUN
  purpose: >-
    Test whether entry-aligned realized exposure counts causally affect Halo
    retention beyond constant, schedule-age, identity-broken, delayed, noisy,
    or head-averaged denominators.

protocol:
  execution_mode: closed_loop_model_execution
  answer_key_access: after_all_inference_and_unscored_artifact
  inferential_statistics: false
  broad_claims: false
  pairing_unit: case_id

paths:
  base: repository_root
  model: Rineya_Published_Cores/Rineya-Halo-1.2.0-devfreeze
  inference: rineya_significance_native_architecture_lab/results/benchmarks/halo_calibration_v3/inference.jsonl
  evaluation: rineya_significance_native_architecture_lab/results/benchmarks/halo_calibration_v3/evaluation.jsonl
  capability_cases: rineya_significance_native_architecture_lab/results/runs/halo_capability_calibration_v2/cases.jsonl
  output_root: rineya_significance_native_architecture_lab/results/runs/halo_count_causal_controls_v1

model:
  core_id: rineya.core.halo.v1.2.0-devfreeze.28L.qwen3-crossdepth-v1-5e4-v2-1e4
  allowed_core_ids:
    - rineya.core.halo.v1.2.0-devfreeze.28L.qwen3-crossdepth-v1-5e4-v2-1e4
  expected_source_base: Qwen3-0.6B
  expected_architecture: Qwen3ForCausalLM
  expected_layers: 28
  expected_hidden_size: 1024
  expected_query_heads: 16
  expected_kv_heads: 8
  expected_head_dim: 128
  expected_vocab_size: 151936
  trust_remote_code: false
  checkpoint_files:
    weights: model.safetensors
    tokenizer: tokenizer.json
    config: config.json
    chat_template: chat_template.jinja
    core: CORE.json
    generation_config: generation_config.json
    tokenizer_config: tokenizer_config.json
  expected_hashes:
    weights: 38fb96fe286776919032c4418eef0a2534e2c2c2865c1465cc9dd4cfe7e36544
    tokenizer: be75606093db2094d7cd20f3c2f385c212750648bd6ea4fb2bf507a6a4c55506
    config: 2284cc1687a4f4f6e3a64a13dfcf7562e592b951afa2f91244cc7b212c9cfb85
    chat_template: 51fa65c79bb57f058dc7ef8734884bd325fe9d45bb03a61bfef59785d3bc2da9
    core: 8317f76d375c3dc09bf0316f5f3452d5a66cba126af235050adc818d4c51d56b
    generation_config: 90d5f4e22a088a995712d44c519d1902acab0988a8f6087dbf73f127cf40ef48
    tokenizer_config: 1f18fb516a5b9ec1286b09ef8df6cbe736ad8298c77d99953d85f182572b273e

runtime:
  device: cpu
  dtype: bfloat16
  attention_implementation: sdpa
  batch_size: 1
  seed: 23
  deterministic: true
  decoding: manual_greedy
  max_new_tokens: 32
  verify_query_rollback: true

conditions:
  - id: true_realized_count
    count_transform: "true"
  - id: constant_count
    count_transform: constant
  - id: age_derived_count
    count_transform: age_derived
  - id: shuffled_count
    count_transform: shuffled
  - id: wrong_token_count
    count_transform: wrong_token
    shift: 1
  - id: delayed_count
    count_transform: delayed
    first_boundary_semantics: zero_count_with_ranking_floor_one
  - id: noisy_count
    count_transform: noisy
    noise_distribution: seeded_normal
    noise_std_fraction_of_mean: 0.10
    clamp_min: 1.0
  - id: head_averaged_count
    count_transform: head_averaged

significance:
  enabled: true
  exponent: 1.0
  exposure_mode: realized_event_count
  preserve_true_counts_across_all_controls: true
  score_pooling:
    enabled: false
    width: 1
  selection_granularity: kv_head

query:
  mode: conditioned
  rendering: raw_question_no_special_tokens
  max_tokens: 64
  probe_schedule: every_nonfinal_chunk_boundary
  access_fairness: identical_across_all_count_controls

cache:
  retained_history_budget: 128
  total_budget_slots: 128
  sink_tokens: 4
  recent_tokens: 32
  compression_chunk_tokens: 128
  compress_only_at_boundaries: true
  final_chunk_left_resident: true
  matched_across_all_count_controls: true

selection:
  source: full_cache_correct_clusters_only
  families: [R1, R3, R4]
  maximum_eligible_clusters_per_family: 4
  excluded_family_reason:
    R2: full_cache_capability_gate_zero_of_eight

attention_prior: {enabled: false, lambda: 0.0}
memory_slots: {enabled: false, count: 0}
controller: {enabled: false, type: none}

outputs:
  resolved_config: resolved_config.yaml
  manifest: manifest.json
  unscored_predictions: predictions.unscored.jsonl
  cases: cases.jsonl
  summary: summary.json
  statistics: statistics.json
  resident_positions: resident_positions/
  boundary_diagnostics: boundary_diagnostics/
  boundary_index: boundary_diagnostics.jsonl
  boundary_evidence: boundary_evidence.jsonl
  restart_state: run_state.json
  partial_predictions: predictions.partial.jsonl
  partial_boundary_index: boundary_diagnostics.partial.jsonl
