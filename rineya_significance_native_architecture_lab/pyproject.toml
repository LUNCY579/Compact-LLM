[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rineya-significance-native-architecture-lab"
version = "0.1.0"
description = "Standalone, CPU-first Cornerstone-1 architecture experiments for published Rineya Qwen3-0.6B cores."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Research-only until a repository license is selected" }
authors = [{ name = "Rineya Research Project" }]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
  "psutil>=6,<8",
]

[project.optional-dependencies]
model = [
  "torch>=2.7,<3",
  "transformers==5.14.1",
  "accelerate>=1.10,<2",
  "safetensors>=0.5,<1",
]
analysis = [
  "pandas>=2.2,<4",
  "statsmodels>=0.14,<1",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.9,<4",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "hypothesis>=6.112,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0,<7",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "model: requires a local model checkpoint",
  "slow: intentionally exceeds the fast Tier-A test budget",
  "gpu: requires CUDA and is never selected by the default test command",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PTH", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["rineya_significance_lab.config", "rineya_significance_lab.cli"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
# Transformers 5.14's Cache.layers annotation is a broad union whose members do
# not expose the runtime methods implemented by the concrete DynamicLayer. The
# live adapter is instead guarded by tensor invariants and model integration
# tests; the Torch-free core and Torch state remain strict-mypy checked.
module = ["rineya_significance_lab.runtime.*"]
ignore_errors = true
