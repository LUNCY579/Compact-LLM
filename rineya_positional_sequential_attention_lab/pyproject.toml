[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rineya-psa-lab"
version = "0.1.0"
description = "Positional significance, KV-head specialization, and sequential attention in the Rineya Qwen3-0.6B family."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Research-only until a repository license is selected" }
authors = [{ name = "Rineya Research Project" }]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
model = ["torch>=2.7,<3", "transformers==5.14.1", "safetensors>=0.5,<1", "accelerate>=1.10,<2"]
analysis = ["pandas>=2.2,<4", "pyarrow>=16", "scikit-learn>=1.5,<2", "statsmodels>=0.14,<1", "matplotlib>=3.9,<4"]
dev = ["pytest>=8.3,<10", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "model: requires a local checkpoint on disk",
  "gpu: requires CUDA",
  "slow: exceeds the fast test budget",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
