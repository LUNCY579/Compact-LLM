[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rineya-state-sufficiency-lab"
version = "1.0.1"
description = "Training and evaluation lab for compact-state versus full-history reasoning supervision."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Rineya Research Project"}]
dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
train = [
  "torch>=2.4",
  "transformers>=4.47,<6",
  "peft>=0.12,<1",
  "accelerate>=1.0,<2",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
]
quant = [
  "bitsandbytes>=0.45; platform_system != 'Darwin'",
]
dev = [
  "pytest>=8",
  "jsonschema>=4.23",
  "ruff>=0.8",
]

[project.scripts]
rineya-state-lab = "rineya_state_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests that inspect the bundled dataset archive",
  "slow: intentionally slower tests",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
