include: _base_lora.yaml
run:
  name: split_stateful_lora
  output_dir: outputs/train/split_stateful_lora

data:
  root: data/prepared
  view: split_stateful
  train_split: train
  eval_split: dev
  max_length: 1024
  max_target_tokens: 256
  pad_to_multiple_of: 8
  train_on_prompt: false
  max_train_examples: null
  max_eval_examples: 2400
  one_transition_per_problem: false
  preserve_trajectory_order: false
  inverse_problem_weight: true
  exact_token_accounting: false
  token_accounting_sample: 4096
  token_cache_size: 4096
