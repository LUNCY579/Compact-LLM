include: split_adapter_dev.yaml
run:
  name: split_adapter_test
  output_dir: outputs/eval/split_adapter_test
data:
  split: test
  require_test_unlock: true
  test_unlock_value: I_UNDERSTAND_TEST_IS_SEALED
protocols:
  - type: generated_rollout
    name: generated_rollout
    limit: null
    max_steps: null
    max_state_chars: 4096
    allow_implicit_final: true
  - type: oracle_transition
    name: oracle_transition
    limit: null
    one_per_problem: false
    target_style: stateful
    generation_batch_size: 1
