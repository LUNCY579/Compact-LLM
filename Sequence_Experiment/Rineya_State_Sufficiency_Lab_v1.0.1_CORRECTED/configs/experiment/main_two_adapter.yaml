name: rineya_state_sufficiency_main
seed: 3407
project_root: .
output_dir: outputs/experiment/main_two_adapter

paths:
  dataset_archive: assets/datasets/Rineya_Sequence_Independence_Dataset_v1.0_COMPLETE.zip
  prepared_data: data/prepared
  train_full_config: configs/train/full_context_lora.yaml
  train_split_config: configs/train/split_stateful_lora.yaml
  eval_full_config: configs/eval/full_adapter_dev.yaml
  eval_split_config: configs/eval/split_adapter_dev.yaml

comparison:
  baseline_predictions: outputs/eval/full_adapter_dev/scored_predictions.jsonl
  candidate_predictions: outputs/eval/split_adapter_dev/scored_predictions.jsonl
  baseline_protocol: direct_solve
  candidate_protocol: generated_rollout
  metric: score.correct_strict
  output_dir: outputs/comparison/dev_primary
  noninferiority_margin: 0.02
  bootstrap_samples: 10000
  randomization_samples: 20000
